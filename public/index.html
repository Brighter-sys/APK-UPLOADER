<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .game-container {
            display: flex;
            gap: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            border: 2px solid #333;
        }
        .square {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }
        .piece {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
        .piece.red { background-color: #d33; }
        .piece.black { background-color: #333; }
        .piece.king::after {
            content: '♔';
            color: gold;
            font-size: 30px;
            line-height: 40px;
            text-align: center;
        }
        .player-info {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .player-info.active {
            box-shadow: 0 0 15px gold;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="player-info" id="player1">
            <h2>Kanyie (Red)</h2>
            <p>Score: <span id="score1">0</span></p>
        </div>
        <div class="board" id="board"></div>
        <div class="player-info" id="player2">
            <h2>Stacie (Black)</h2>
            <p>Score: <span id="score2">0</span></p>
        </div>
    </div>
    <div id="popup" class="popup" style="display: none;"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let game, player;

        const board = document.getElementById('board');
        const popup = document.getElementById('popup');

        function showPopup(message, duration = 2000) {
            popup.textContent = message;
            popup.style.display = 'block';
            setTimeout(() => { popup.style.display = 'none'; }, duration);
        }

        function updateBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    if (game.board[row][col]) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${game.board[row][col].color}`;
                        if (game.board[row][col].king) piece.classList.add('king');
                        piece.addEventListener('click', () => selectPiece(row, col));
                        square.appendChild(piece);
                    }
                    square.addEventListener('click', () => selectSquare(row, col));
                    board.appendChild(square);
                }
            }
        }

        let selectedPiece = null;

        function selectPiece(row, col) {
            if (game.currentTurn !== player.color) return;
            if (game.board[row][col]?.color !== player.color) return;
            selectedPiece = { row, col };
            updateBoard();
            highlightMoves(row, col);
        }

        function highlightMoves(row, col) {
            const moves = getValidMoves(row, col);
            moves.forEach(move => {
                const square = board.children[move.to.row * 8 + move.to.col];
                square.style.backgroundColor = 'lightgreen';
            });
        }

        function selectSquare(row, col) {
            if (!selectedPiece) return;
            const move = getValidMoves(selectedPiece.row, selectedPiece.col)
                .find(m => m.to.row === row && m.to.col === col);
            if (move) {
                socket.emit('makeMove', { gameId: game.id, move });
                selectedPiece = null;
            }
        }

        function getValidMoves(row, col) {
            const piece = game.board[row][col];
            if (!piece) return [];

            const moves = [];
            const directions = piece.king ? [-1, 1] : piece.color === 'red' ? [-1] : [1];

            directions.forEach(dRow => {
                [-1, 1].forEach(dCol => {
                    if (isValidMove(row, col, row + dRow, col + dCol)) {
                        moves.push({ from: { row, col }, to: { row: row + dRow, col: col + dCol } });
                    }
                    if (isValidCapture(row, col, row + dRow, col + dCol, row + 2*dRow, col + 2*dCol)) {
                        moves.push({
                            from: { row, col },
                            to: { row: row + 2*dRow, col: col + 2*dCol },
                            captures: { row: row + dRow, col: col + dCol }
                        });
                    }
                });
            });

            return moves;
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            if (toRow < 0 || toRow > 7 || toCol < 0 || toCol > 7) return false;
            if (game.board[toRow][toCol]) return false;
            return true;
        }

        function isValidCapture(fromRow, fromCol, overRow, overCol, toRow, toCol) {
            if (!isValidMove(fromRow, fromCol, toRow, toCol)) return false;
            if (!game.board[overRow][overCol]) return false;
            if (game.board[overRow][overCol].color === game.board[fromRow][fromCol].color) return false;
            return true;
        }

        function updatePlayerInfo() {
            document.getElementById('player1').classList.toggle('active', game.currentTurn === 'red');
            document.getElementById('player2').classList.toggle('active', game.currentTurn === 'black');
        }

        socket.on('gameJoined', (data) => {
            game = data.game;
            player = data.player;
            updateBoard();
            updatePlayerInfo();
            showPopup(`Welcome, ${player.name}! You are playing as ${player.color}.`);
        });

        socket.on('gameStart', (updatedGame) => {
            game = updatedGame;
            updateBoard();
            updatePlayerInfo();
            showPopup('Game started! Red goes first.');
        });

        socket.on('moveMade', ({ game: updatedGame, move }) => {
            game = updatedGame;
            updateBoard();
            updatePlayerInfo();
            if (move.captures) {
                showPopup(`${game.currentTurn === 'red' ? 'Stacie' : 'Kanyie'} captured a piece!`);
            }
        });

        socket.on('playerLeft', ({ game: updatedGame }) => {
            game = updatedGame;
            showPopup('Your opponent left the game. Waiting for a new player...');
        });

        socket.emit('joinGame');
    </script>
</body>
</html>
</body>
</html>
