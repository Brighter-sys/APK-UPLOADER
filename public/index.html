<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACIE NGATIA'S PLAYSTORE</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #6200ee;
            --accent-color: #03dac6;
            --background: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --danger-color: #cf6679;
            --success-color: #4caf50;
            --board-dark: #8B4513;
            --board-light: #DEB887;
            --piece-red: #FF4444;
            --piece-black: #333333;
        }

        :root {
            --primary-color: #6200ee;
            --accent-color: #03dac6;
            --background: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--background);
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Add new tab styles */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 0.5rem;
            background: var(--card-bg);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.2);
        }

        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            padding: 2rem;
            border-radius: 0 0 2rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(98, 0, 238, 0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0.8));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .upload-section {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .upload-section:hover {
            transform: translateY(-5px);
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .input-group input[type="file"] {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .file-type {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(98, 0, 238, 0.3);
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            overflow: hidden;
            height: 0.5rem;
            margin-top: 1rem;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .app-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 1rem;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
        }

        .app-screenshots {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 177.78%; /* This is for a 9:16 aspect ratio (common for mobile screenshots) */
            overflow: hidden;
        }

        .screenshot-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.3s ease;
        }

        .app-screenshot {
            width: 100%;
            height: 100%;
            object-fit: contain; /* This ensures the entire image is visible */
            flex-shrink: 0;
            background-color: rgba(0, 0, 0, 0.1); /* Light background to see image boundaries */
        }

        .screenshot-nav {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            z-index: 1; /* Ensure buttons are above the images */
        }

        .screenshot-nav button {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .screenshot-dots {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 5px;
            z-index: 1; /* Ensure dots are above the images */
        }

        .screenshot-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        .screenshot-dot.active {
            background: white;
        }

        .app-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(207, 102, 121, 0.3);
        }

        .upload-preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            display: none;
        }

        .preview-icon {
            width: 48px;
            height: 48px;
            border-radius: 0.5rem;
            object-fit: cover;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(98, 0, 238, 0.3);
        }

        /* Add popup styles */
        .popup {
            position: fixed;
            bottom: -100px; /* Start below the viewport */
            left: 50%;
            transform: translateX(-50%);
            background: var(--success-color);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .popup.show {
            bottom: 2rem;
            opacity: 1;
        }

        .popup-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .popup-message {
            font-weight: 500;
        }

        /* Success checkmark animation */
        .checkmark {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: white;
            stroke-miterlimit: 10;
            stroke-dasharray: 340;
            stroke-dashoffset: 340;
            animation: draw 1s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        @keyframes draw {
            100% { stroke-dashoffset: 0; }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                border-radius: 0 0 1.5rem 1.5rem;
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .app-screenshots {
                scroll-snap-type: x mandatory;
            }

            .app-screenshot {
                scroll-snap-align: center;
            }

            .screenshot-nav {
                display: flex;
            }
        }

        /* Add checker game styles */
        .game-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
        }

        .game-board {
            width: 560px;
            height: 560px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 4px solid var(--board-dark);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .piece {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
        }

        .piece.red {
            background: var(--piece-red);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .piece.black {
            background: var(--piece-black);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .piece.king::after {
            content: '👑';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }

        .piece.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--primary-color);
        }

        .game-info {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            min-width: 300px;
            backdrop-filter: blur(10px);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .player-score {
            flex: 1;
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
        }

        .player-score.active {
            box-shadow: 0 0 15px var(--primary-color);
        }

        .forfeit-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dare-input {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 0.5rem;
            color: var(--text-primary);
        }

        .game-button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border: none;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .game-button:hover {
            transform: translateY(-2px);
        }

        .forfeit-amount {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent; /* Fallback for browsers that don't support background-clip: text */
        }

        @media (max-width: 768px) {
            .game-board {
                width: 320px;
                height: 320px;
            }

            .square {
                width: 40px;
                height: 40px;
            }

            .piece {
                width: 30px;
                height: 30px;
            }
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 1000;
            display: none; /* Initially hidden */
            animation: pop 0.5s ease-in-out;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .balloon {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 80px;
            background-color: #ff4d4d;
            border-radius: 50px 50px 0 0;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -20px); }
            100% { transform: translate(-50%, 0); }
        }

        /* Add this to your CSS */
        .piece.king {
            background-color: gold; /* Change color or add a crown icon */
        }

        /* Add this to your CSS */
        #checkerBoard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 80vmin;
            height: 80vmin;
            border: 5px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.5));
        }

        .square {
            position: relative;
            width: 100%;
            height: 100%;
            transition: background 0.3s;
        }

        .square.light {
            background: rgba(255, 255, 255, 0.1);
        }

        .square.dark {
            background: rgba(0, 0, 0, 0.3);
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 1000;
        }

        /* Add this inside the game-info div for the control menu */
        .control-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .score-counter {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: white;
        }

        /* Add this to your existing CSS */
        .game-board {
            perspective: 1000px; /* For 3D effect */
        }

        .square {
            transition: transform 0.3s, box-shadow 0.3s; /* Smooth transitions */
        }

        .square:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); /* Glowing effect on hover */
        }

        .piece {
            transition: transform 0.3s, box-shadow 0.3s; /* Smooth transitions */
        }

        .piece.active {
            box-shadow: 0 0 20px rgba(0, 255, 0, 1); /* Glowing effect for active pieces */
        }

        .piece.captured {
            animation: particleBurst 0.5s forwards; /* Particle burst effect */
        }

        @keyframes particleBurst {
            /* Define your particle burst animation here */
        }

        /* Control menu styles */
        .control-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }

        .score-counter {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: white;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>STACIE NGATIA'S PLAYSTORE</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" data-tab="my-apps">My Apps</button>
            <button class="tab" data-tab="upload-app">Upload App</button>
            <button class="tab" data-tab="games">Games</button>
        </div>

        <div id="my-apps" class="tab-content active">
            <div class="apps-grid" id="fileList">
                <!-- Apps will be dynamically inserted here -->
            </div>
        </div>

        <div id="upload-app" class="tab-content">
            <div class="upload-section">
                <form id="uploadForm" class="upload-form">
                    <div class="input-group">
                        <label for="password">Access Key:</label>
                        <input type="password" id="password" placeholder="Enter Access Key" required>
                    </div>
                    <div class="input-group">
                        <label for="apkFile">APK File:</label>
                        <input type="file" accept=".apk" required id="apkFile">
                        <span class="file-type">Select .apk file</span>
                    </div>
                    <div class="input-group">
                        <label for="appIcon">App Icon:</label>
                        <input type="file" accept="image/*" id="appIcon">
                        <span class="file-type">Select image for app icon</span>
                    </div>
                    <div class="input-group">
                        <label for="screenshots">Screenshots:</label>
                        <input type="file" accept="image/*" multiple id="screenshots">
                        <span class="file-type">Select one or more screenshot images</span>
                    </div>
                    <div class="upload-preview" id="uploadPreview">
                        <img id="appIconPreview" class="preview-icon" style="display: none;">
                    </div>
                    <button type="submit" class="upload-btn">Upload Application</button>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add new games tab content -->
    <div id="games" class="tab-content">
        <div class="game-container">
            <div class="game-board" id="checkerBoard"></div>
            <div class="game-info">
                <button class="game-button" id="startGameBtn">Start Game</button>
                <div id="gameMessage" style="display: none;"></div>
                <div class="score-board">
                    <div class="player-score" id="player1Score">
                        <h3>Player 1 (Red)</h3>
                        <p>Score: <span>0</span></p>
                    </div>
                    <div class="player-score" id="player2Score">
                        <h3>Player 2 (Black)</h3>
                        <p>Score: <span>0</span></p>
                    </div>
                </div>
                <button class="game-button" id="newGameBtn">New Game</button>
                
                <div class="forfeit-section" id="forfeitSection" style="display: none;">
                    <h3>Game Over!</h3>
                    <p>Winner: <span id="winnerName"></span></p>
                    <div class="congratulations-message" id="congratulationsMessage" style="display: none;">
                        <h2>Congratulations!</h2>
                        <p>What a great game! Abdul Misses You</p>
                    </div>
                </div>
                <!-- Add this inside the game-info div for the control menu -->
                <div class="control-menu">
                    <button id="undoMoveBtn">Undo</button>
                    <button id="restartGameBtn">Restart</button>
                    <button id="settingsBtn">Settings</button>
                </div>
                <div class="score-counter">
                    <div class="score" id="redScore">0</div>
                    <div class="score" id="blackScore">0</div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Add popup HTML -->
    <div class="popup" id="uploadPopup">
        <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <span class="popup-message">Upload completed successfully!</span>
    </div>

    <!-- Add this script tag before your existing script -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Include Three.js in your HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        // Add tab functionality
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and contents
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(content => {
                    content.classList.remove('active');
                    content.style.display = 'none';
                });

                // Add active class to clicked tab and show corresponding content
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                const tabContent = document.getElementById(tabId);
                tabContent.classList.add('active');
                tabContent.style.display = 'block';
            });
        });

        // Add popup functionality
        function showPopup(message) {
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.textContent = message;
            document.body.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 3000);
        }

        const uploadForm = document.getElementById('uploadForm');
        const progressContainer = document.querySelector('.progress-container');
        const progressBar = document.querySelector('.progress-bar');
        const fileList = document.getElementById('fileList');
        const passwordInput = document.getElementById('password');
        const apkFileInput = document.getElementById('apkFile');
        const appIconInput = document.getElementById('appIcon');
        const screenshotsInput = document.getElementById('screenshots');
        const appIconPreview = document.getElementById('appIconPreview');
        const uploadPreview = document.getElementById('uploadPreview');
        const correctPassword = 'Abdul';

        appIconInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    appIconPreview.src = e.target.result;
                    appIconPreview.style.display = 'block';
                    uploadPreview.style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const apkFile = apkFileInput.files[0];
            const appIcon = appIconInput.files[0];
            const screenshots = screenshotsInput.files;
            const password = passwordInput.value;

            if (!apkFile) {
                alert('Please select an APK file to upload.');
                return;
            }

            if (password !== correctPassword) {
                alert('Invalid access key. Please try again.');
                return;
            }

            const formData = new FormData();
            formData.append('apk', apkFile);
            if (appIcon) {
                formData.append('icon', appIcon);
            }
            Array.from(screenshots).forEach((screenshot, index) => {
                formData.append(`screenshot${index}`, screenshot);
            });

            progressContainer.style.display = 'block';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressBar.style.width = percentComplete + '%';
                }
            });

            xhr.onload = async () => {
                if (xhr.status === 200) {
                    // Reset form
                    apkFileInput.value = '';
                    passwordInput.value = '';
                    appIconInput.value = '';
                    screenshotsInput.value = '';
                    appIconPreview.style.display = 'none';
                    uploadPreview.style.display = 'none';
                    
                    // Show success popup
                    showPopup('Upload completed successfully!');
                    
                    // Switch to My Apps tab
                    const myAppsTab = document.querySelector('[data-tab="my-apps"]');
                    myAppsTab.click();
                    
                    // Reload files
                    await loadFiles();
                } else {
                    showPopup('Upload failed: ' + xhr.statusText, 5000);
                }
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            };

            xhr.send(formData);
        });

        function initializeScreenshotSliders() {
            document.querySelectorAll('.app-card').forEach(card => {
                const screenshotsContainer = card.querySelector('.app-screenshots');
                const container = card.querySelector('.screenshot-container');
                const prevButton = card.querySelector('.prev-screenshot');
                const nextButton = card.querySelector('.next-screenshot');
                const dots = card.querySelectorAll('.screenshot-dot');
                const screenshots = card.querySelectorAll('.app-screenshot');
                let currentIndex = 0;

                // Adjust container aspect ratio based on the first image
                const firstImage = screenshots[0];
                if (firstImage) {
                    firstImage.onload = function() {
                        const aspectRatio = (this.naturalHeight / this.naturalWidth) * 100;
                        screenshotsContainer.style.paddingBottom = `${aspectRatio}%`;
                    }
                }

                function updateSlider() {
                    container.style.transform = `translateX(-${currentIndex * 100}%)`;
                    dots.forEach((dot, index) => {
                        dot.classList.toggle('active', index === currentIndex);
                    });
                }

                prevButton.addEventListener('click', () => {
                    currentIndex = (currentIndex - 1 + screenshots.length) % screenshots.length;
                    updateSlider();
                });

                nextButton.addEventListener('click', () => {
                    currentIndex = (currentIndex + 1) % screenshots.length;
                    updateSlider();
                });

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => {
                        currentIndex = index;
                        updateSlider();
                    });
                });
            });
        }

        async function loadFiles() {
            const response = await fetch('/files');
            const files = await response.json();
            
            fileList.innerHTML = files.map(file => createAppCard(file)).join('');
            
            initializeScreenshotSliders();
        }

        async function deleteApp(fileId) {
            if (!confirm('Are you sure you want to delete this app?')) return;
            
            const password = prompt('Enter access key to delete:');
            if (!password) {
                alert('Delete operation cancelled');
                return;
            }

            const url = `/delete/${fileId}`; // Don't modify fileId here
            console.log('Sending delete request to:', url);

            try {
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${password}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (response.ok) {
                    const result = await response.json();
                    alert(result.message || 'App deleted successfully');
                    await loadFiles();
                } else {
                    const errorText = await response.text();
                    console.error('Server response:', response.status, errorText);
                    alert(`Failed to delete app. Status: ${response.status}. ${errorText}`);
                }
            } catch (error) {
                console.error('Error deleting app:', error);
                alert(`Failed to delete app. Error: ${error.message}`);
            }
        }

        function createAppCard(file) {
            const screenshots = file.screenshots || ['/api/placeholder/160/300', '/api/placeholder/160/300'];
            return `
                <div class="app-card" data-id="${file.id}">
                    <div class="app-header">
                        <img src="${file.icon || '/api/placeholder/72/72'}" alt="App icon" class="app-icon">
                        <div class="app-info">
                            <h3 class="app-name">${file.originalName}</h3>
                            <div class="app-meta">
                                <div>Size: ${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                                <div>Released: ${new Date(file.uploadDate).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </div>
                    <div class="app-screenshots">
                        <div class="screenshot-container">
                            ${screenshots.map(screenshot => 
                                `<img src="${screenshot}" alt="App screenshot" class="app-screenshot">`
                            ).join('')}
                        </div>
                        <div class="screenshot-nav">
                            <button class="prev-screenshot">&lt;</button>
                            <button class="next-screenshot">&gt;</button>
                        </div>
                        <div class="screenshot-dots">
                            ${screenshots.map((_, index) => 
                                `<div class="screenshot-dot${index === 0 ? ' active' : ''}"></div>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="app-actions">
                        <a href="/download/${file.id}" class="download-btn">Download</a>
                        <button onclick="deleteApp('${file.id}')" class="delete-btn">Delete</button>
                    </div>
                </div>
            `;
        }

        loadFiles();

        // Checkers game implementation
        class CheckersGame {
            constructor() {
                this.board = Array(8).fill().map(() => Array(8).fill(null));
                this.currentPlayer = 'red';
                this.selectedPiece = null;
                this.scores = { red: 0, black: 0 };
                this.gameOver = false;
                this.playerColor = null;
                this.gameId = null;
                this.socket = io();

                this.socket.on('playerAssign', (data) => {
                    this.playerColor = data.color;
                    console.log(`You are playing as ${this.playerColor}`);
                });

                this.socket.on('gameStart', (data) => {
                    this.gameId = data.gameId;
                    this.initializeBoard();
                    console.log(`Game started with ID: ${this.gameId}`);
                });

                this.socket.on('opponentMove', (move) => {
                    this.makeMove(move.startRow, move.startCol, move.endRow, move.endCol);
                    this.renderBoard();
                });
            }

            initializeBoard() {
                // Place initial pieces
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        if ((row + col) % 2 === 1) {
                            if (row < 3) this.board[row][col] = { color: 'black', king: false };
                            if (row > 4) this.board[row][col] = { color: 'red', king: false };
                        }
                    }
                }
                this.renderBoard();
            }

            renderBoard() {
                const board = document.getElementById('checkerBoard');
                board.innerHTML = '';

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                        
                        if (this.board[row][col]) {
                            const piece = document.createElement('div');
                            piece.className = `piece ${this.board[row][col].color}`;
                            if (this.board[row][col].king) piece.classList.add('king'); // Highlight king pieces
                            piece.addEventListener('click', () => this.handlePieceClick(row, col));
                            square.appendChild(piece);
                        }

                        square.addEventListener('click', () => this.handleSquareClick(row, col));
                        board.appendChild(square);
                    }
                }

                document.getElementById('player1Score').classList.toggle('active', this.currentPlayer === 'red');
                document.getElementById('player2Score').classList.toggle('active', this.currentPlayer === 'black');
            }

            handlePieceClick(row, col) {
                const piece = this.board[row][col];
                if (piece && piece.color === this.playerColor && !this.gameOver) {
                    this.selectedPiece = { row, col };
                    this.renderBoard();
                }
            }

            handleSquareClick(row, col) {
                if (this.currentPlayer !== this.playerColor || this.gameOver) return;

                if (this.selectedPiece && !this.board[row][col]) {
                    if (this.isValidMove(this.selectedPiece.row, this.selectedPiece.col, row, col)) {
                        this.socket.emit('makeMove', {
                            gameId: this.gameId,
                            startRow: this.selectedPiece.row,
                            startCol: this.selectedPiece.col,
                            endRow: row,
                            endCol: col
                        });
                        this.makeMove(this.selectedPiece.row, this.selectedPiece.col, row, col);
                        this.selectedPiece = null;
                        this.renderBoard();
                        
                        if (this.checkWinner()) {
                            this.handleGameOver();
                        }
                    }
                }
            }

            isValidMove(startRow, startCol, endRow, endCol) {
                const piece = this.board[startRow][startCol];
                const rowDiff = endRow - startRow;
                const colDiff = Math.abs(endCol - startCol);

                if (!piece || colDiff === 0) return false;

                // Regular pieces can only move forward
                if (!piece.king) {
                    if (piece.color === 'red' && rowDiff >= 0) return false;
                    if (piece.color === 'black' && rowDiff <= 0) return false;
                }

                // Check for jump move
                if (colDiff === 2 && Math.abs(rowDiff) === 2) {
                    const jumpedRow = startRow + rowDiff / 2;
                    const jumpedCol = startCol + (endCol - startCol) / 2;
                    const jumpedPiece = this.board[jumpedRow][jumpedCol];
                    return jumpedPiece && jumpedPiece.color !== piece.color;
                }

                // Regular move
                return colDiff === 1 && Math.abs(rowDiff) === 1;
            }

            makeMove(startRow, startCol, endRow, endCol) {
                const piece = this.board[startRow][startCol];

                // Handle jumps
                if (Math.abs(endCol - startCol) === 2) {
                    const jumpedRow = startRow + (endRow - startRow) / 2;
                    const jumpedCol = startCol + (endCol - startCol) / 2;
                    this.board[jumpedRow][jumpedCol] = null; // Remove the jumped piece
                    showMoveNotification(`Captured a piece!`);
                }

                // Move piece
                this.board[endRow][endCol] = piece;
                this.board[startRow][startCol] = null;

                // King promotion
                if ((piece.color === 'red' && endRow === 0) || 
                    (piece.color === 'black' && endRow === 7)) {
                    piece.king = true;
                    piece.element.classList.add('king'); // Highlight the piece visually
                }

                // Switch turns
                this.currentPlayer = this.currentPlayer === 'red' ? 'black' : 'red';
                updateScore(); // Update score after each move
            }

            checkWinner() {
                let redPieces = 0;
                let blackPieces = 0;

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        if (this.board[row][col]) {
                            if (this.board[row][col].color === 'red') redPieces++;
                            else blackPieces++;
                        }
                    }
                }

                // Check for no pieces
                if (redPieces === 0) {
                    return 'black';
                } else if (blackPieces === 0) {
                    return 'red';
                }

                // Check for no legal moves
                if (!this.hasLegalMoves('red')) {
                    return 'black';
                } else if (!this.hasLegalMoves('black')) {
                    return 'red';
                }

                return null;
            }

            hasLegalMoves(color) {
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        if (this.board[row][col] && this.board[row][col].color === color) {
                            // Check for possible moves
                            for (let r = -1; r <= 1; r++) {
                                for (let c = -1; c <= 1; c++) {
                                    if (this.isValidMove(row, col, row + r, col + c)) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                }
                return false;
            }

            handleGameOver() {
                this.gameOver = true;
                const forfeitSection = document.getElementById('forfeitSection');
                const winnerName = document.getElementById('winnerName');
                const congratulationsMessage = document.getElementById('congratulationsMessage');

                winnerName.textContent = this.currentPlayer === 'red' ? 'Player 2 (Black)' : 'Player 1 (Red)';
                
                // Show the congratulatory message
                congratulationsMessage.style.display = 'block';
                forfeitSection.style.display = 'block';
            }

            resetGame() {
                this.board = Array(8).fill().map(() => Array(8).fill(null));
                this.currentPlayer = 'red';
                this.selectedPiece = null;
                this.gameOver = false;
                this.initializeBoard();
                document.getElementById('forfeitSection').style.display = 'none';
                document.getElementById('dareSection').style.display = 'none';
            }
        }

        // Initialize game now
        let game = new CheckersGame();

        // Add event listeners for game controls
        document.getElementById('newGameBtn').addEventListener('click', () => {
            game.resetGame();
        });

        document.getElementById('rejectPaymentBtn').addEventListener('click', () => {
            document.getElementById('dareSection').style.display = 'block';
        });

        document.getElementById('submitDareBtn').addEventListener('click', () => {
            const dareInput = document.getElementById('dareInput');
            if (dareInput.value.trim() !== '') {
                alert(`Dare submitted: ${dareInput.value}`);
                dareInput.value = '';
                document.getElementById('dareSection').style.display = 'none';
                game.resetGame();
            } else {
                alert('Please enter a dare before submitting.');
            }
        });

        // Initialize the game board
        game.renderBoard();

        document.getElementById('startGameBtn').addEventListener('click', () => {
            socket.emit('startGame');
        });

        socket.on('gameStart', (data) => {
            gameId = data.gameId;
            const firstPlayerMessage = data.firstPlayerColor === 'red' ? 'Player 1 (Red) will start the game!' : 'Player 2 (Black) will start the game!';
            
            // Show the pop-up
            const popup = document.getElementById('startGamePopup');
            const messageSpan = document.getElementById('startGameMessage');
            messageSpan.textContent = firstPlayerMessage;
            popup.style.display = 'block';

            // Create a balloon element
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            popup.appendChild(balloon);

            // Hide the pop-up after 5 seconds
            setTimeout(() => {
                popup.style.display = 'none';
                popup.removeChild(balloon); // Remove the balloon after hiding the popup
            }, 5000);

            // Initialize the game board
            game.initializeBoard(); // Ensure you call the correct method to set up the board
        });

        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            sound.currentTime = 0; // Reset sound to start
            sound.play();
        }

        function showParticles() {
            particlesJS("particles-js", {
                particles: {
                    number: { value: 100 },

        document.getElementById('pieceSkinSelector').addEventListener('change', (event) => {
            const selectedSkin = event.target.value;
            // Apply the selected skin to the pieces
            applyPieceSkin(selectedSkin);

        function highlightValidMoves(validMoves) {
            validMoves.forEach(move => {
                const square = document.querySelector(`.square[data-row="${move.row}"][data-col="${move.col}"]`);
                square.classList.add('highlight');
            });

        // Add this function to show move notifications
        function showMoveNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'move-notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Function to update scores
        function updateScore() {
            document.getElementById('redScore').textContent = this.scores.red;
            document.getElementById('blackScore').textContent = this.scores.black;
        }

        // Add event listeners for control buttons
        document.getElementById('undoMoveBtn').addEventListener('click', () => {
            // Implement undo functionality
        });

        document.getElementById('restartGameBtn').addEventListener('click', () => {
            game.resetGame();
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            // Implement settings functionality
        });

        // Function to update the score display
        function updateScore(redScore, blackScore) {
            document.getElementById('redScore').textContent = redScore;
            document.getElementById('blackScore').textContent = blackScore;
        }

        // Function to show move notifications
        function showMoveNotification(message) {
            const notification = document.getElementById('moveNotification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function renderBoard(board) {
            const checkerBoard = document.getElementById('checkerBoard');
            checkerBoard.innerHTML = ''; // Clear the board

            board.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const square = document.createElement('div');
                    square.className = `square ${(rowIndex + colIndex) % 2 === 0 ? 'light' : 'dark'}`;
                    if (cell) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${cell.color}`;
                        square.appendChild(piece);
                    }
                    checkerBoard.appendChild(square);
                });
            });
        }

        socket.on('gameStateUpdate', (game) => {
            // Update the board and scores based on the game state
            renderBoard(game.board);
            updateScore(game.scores.red, game.scores.black);
        });

        // Handle game over
        socket.on('gameOver', (data) => {
            document.getElementById('winnerName').textContent = data.message;
            document.getElementById('forfeitSection').style.display = 'block';
        });

    </script>
